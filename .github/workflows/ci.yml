name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      mode:
        description: 'test or dry-run (ad-hoc package, never an official release)'
        type: choice
        options: [test, dry-run]
        default: test

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      run_package: ${{ steps.plan.outputs.run_package }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail

          run_package=false
          version=''

          case "$REF" in
            refs/tags/v*)
              run_package=true
              version="${REF#refs/tags/v}"
              ;;
          esac

          if [ "$EVENT" = 'workflow_dispatch' ] && [ "$MODE" = 'dry-run' ]; then
            run_package=true
            case "$REF" in
              refs/tags/v*) ;;
              *) version="0.0.${GITHUB_RUN_NUMBER}" ;;
            esac
          fi

          {
            echo "run_package=$run_package"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app
      - name: Run tests
        run: make test

  package-dry-run:
    needs: [plan, test]
    if: needs.plan.outputs.run_package == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app
      - name: Build universal ad-hoc application
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: make build VERSION="$VERSION"
      - name: Verify universal ad-hoc application
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: scripts/verify-release --ad-hoc --expected-version "$VERSION" build/Build/Products/Release/QLOmni.app
      - name: Package ad-hoc dry run
        id: package
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          zip_name="QLOmni-${VERSION}-adhoc-dry-run.zip"
          ditto -c -k --sequesterRsrc --keepParent build/Build/Products/Release/QLOmni.app "$zip_name"
          scripts/verify-release --ad-hoc --expected-version "$VERSION" "$zip_name"
          shasum -a 256 "$zip_name" >"${zip_name}.sha256"
          echo "zip_name=$zip_name" >> "$GITHUB_OUTPUT"
      - name: Upload ad-hoc dry-run artifact
        uses: actions/upload-artifact@v7
        with:
          name: qlomni-adhoc-dry-run
          path: |
            ${{ steps.package.outputs.zip_name }}
            ${{ steps.package.outputs.zip_name }}.sha256
          if-no-files-found: error
          retention-days: 14
