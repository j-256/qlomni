name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      mode:
        description: 'test or dry-run (ad-hoc package, never an official release)'
        type: choice
        options: [test, dry-run]
        default: test

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      run_package: ${{ steps.plan.outputs.run_package }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail

          run_package=false
          version=''

          case "$REF" in
            refs/tags/v*)
              run_package=true
              version="${REF#refs/tags/v}"
              ;;
          esac

          if [ "$EVENT" = 'workflow_dispatch' ] && [ "$MODE" = 'dry-run' ]; then
            run_package=true
            case "$REF" in
              refs/tags/v*) ;;
              *) version="0.0.${GITHUB_RUN_NUMBER}" ;;
            esac
          fi

          {
            echo "run_package=$run_package"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app
      - name: Run tests
        run: make test
      - name: Capture native project preview
        run: make capture-cover
      - name: Retain generated project cover
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: project-cover
          path: docs/screenshots/cover.png
          if-no-files-found: error
          retention-days: 7

  package-dry-run:
    needs: [plan, test]
    if: needs.plan.outputs.run_package == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app
      - name: Build universal ad-hoc application
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: make build VERSION="$VERSION"
      - name: Verify universal ad-hoc application
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: scripts/verify-release --ad-hoc --expected-version "$VERSION" build/Build/Products/Release/QLOmni.app
      - name: Package ad-hoc dry run
        id: package
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          zip_name="QLOmni-${VERSION}-adhoc-dry-run.zip"
          ditto -c -k --sequesterRsrc --keepParent build/Build/Products/Release/QLOmni.app "$zip_name"
          scripts/verify-release --ad-hoc --expected-version "$VERSION" "$zip_name"
          shasum -a 256 "$zip_name" >"${zip_name}.sha256"
          echo "zip_name=$zip_name" >> "$GITHUB_OUTPUT"
      - name: Upload ad-hoc dry-run artifact
        uses: actions/upload-artifact@v7
        with:
          name: qlomni-adhoc-dry-run
          path: |
            ${{ steps.package.outputs.zip_name }}
            ${{ steps.package.outputs.zip_name }}.sha256
          if-no-files-found: error
          retention-days: 14

  publish-cover:
    name: Publish project cover
    if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    needs: [test]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: project-cover
          path: ${{ runner.temp }}/project-cover
      - name: Commit changed cover from this build
        env:
          COVER_ARTIFACT: ${{ runner.temp }}/project-cover/cover.png
        run: |
          set -eu
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo "A newer source commit superseded this cover; its build owns publication."
            exit 0
          fi
          cp "$COVER_ARTIFACT" docs/screenshots/cover.png
          if git diff --quiet -- docs/screenshots/cover.png; then
            echo "Project cover is unchanged."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- docs/screenshots/cover.png
          git commit -m 'docs: refresh generated project cover' -- docs/screenshots/cover.png
          git push origin HEAD:main
